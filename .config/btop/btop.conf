# Built-in TTY colors inherit the terminal palette (Cursor Midnight in Alacritty).
color_theme = "TTY"
theme_background = false
truecolor = true
force_tty = false
rounded_corners = true
graph_symbol = "braille"

shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = false
proc_per_core = false
clock_format = "%X"

# Keep hardware/network detection automatic; do not require elevated privileges.
show_cpu_watts = false
# UI changes are session-local; edit this file to persist preferences.
save_config_on_exit = false
